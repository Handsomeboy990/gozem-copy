server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service workers must never be cached, so app updates are picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    location ~ ^/(app|driver|merchant|admin)/sw\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location /driver/ {
        alias /usr/share/nginx/html/driver/;
        try_files $uri $uri/ /driver/index.html;
    }

    location /merchant/ {
        alias /usr/share/nginx/html/merchant/;
        try_files $uri $uri/ /merchant/index.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
